name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  unit-and-api:
    name: Unit + API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run unit + API tests
        env:
          # Dummy values — unit/API tests mock all external services.
          ANTHROPIC_API_KEY: test-key-not-real
          RESEND_API_KEY: test-key-not-real
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-key
          UPSTASH_REDIS_REST_URL: https://test.upstash.io
          UPSTASH_REDIS_REST_TOKEN: test-token
          HMAC_SECRET: test-hmac-secret-32-chars-minimum-ok
          CRON_SECRET: test-cron-secret
          BASE_URL: http://localhost:3000
          CITIZEN_EMAIL_FROM: onboarding@resend.dev
        run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: unit-and-api
    # Non-empty values for every var instrumentation.ts validates at startup,
    # falling back to dummies so the dev server boots even before repo secrets
    # are configured. The E2E flows that run (homepage/map render, /file camera
    # zone) do not need real credentials; the rest skip gracefully.
    env:
      CI: 'true'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'ci-dummy-anthropic' }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'ci-dummy-resend' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://ci-dummy.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-dummy-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'ci-dummy-service-key' }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || 'https://ci-dummy.upstash.io' }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || 'ci-dummy-token' }}
      HMAC_SECRET: ${{ secrets.HMAC_SECRET || 'ci-dummy-hmac-secret-32-characters-minimum' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET || 'ci-dummy-cron' }}
      BASE_URL: http://localhost:3000
      CITIZEN_EMAIL_FROM: onboarding@resend.dev
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Playwright's webServer config starts `npm run dev`, waits for
      # http://localhost:3000, runs the tests, then shuts the server down.
      - name: Run E2E tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
